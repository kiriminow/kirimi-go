name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...

      # Go has no registry: the tag itself is the release. This just asks the
      # public proxy to cache the new version so `go get` resolves it faster.
      - name: warm the module proxy
        run: |
          curl -sfS "https://proxy.golang.org/github.com/kiriminow/kirimi-go/@v/${GITHUB_REF_NAME}.info" \
            && echo "proxy cached ${GITHUB_REF_NAME}" \
            || echo "proxy warm-up skipped"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
